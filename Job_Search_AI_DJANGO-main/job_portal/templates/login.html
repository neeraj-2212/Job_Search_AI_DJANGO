{% extends "base.html" %}
{% load static %}


    {% block title %}Login Page{% endblock title %} 

    {% block home %}

    <!-- HOME -->
    <section class="section-hero overlay inner-page bg-image" style="background-image: url({%static 'images/hero_1.jpg' %});" id="home-section">
      <div class="container">
        <div class="row">
          <div class="col-md-7">
            <h1 class="text-white font-weight-bold">Sign Up/Login</h1>
            <div class="custom-breadcrumbs">
              <a href="#">Home</a> <span class="mx-2 slash">/</span>
              <span class="text-white"><strong>Log In</strong></span>
            </div>
          </div>
        </div>
      </div>
    </section>
<center>
    <section class="site-section">
      <div class="container">
        <div class="row">
          <div class="col-lg-12 mb-5">
            <h2 class="mb-4">Sign Up To JobBoard</h2>
            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
          {% endif %}
          
          <form method="POST" class="p-4 border rounded">
            {% csrf_token %}
            <div class="form-group">
              <label for="username">Username</label>
              <input name="username" type="text" class="form-control" placeholder="Enter Username" required>
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input name="email" type="email" class="form-control" placeholder="Enter Email" required>
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <input name="password" type="password" class="form-control" placeholder="Enter Password" required>
            </div>
            <input type="submit" value="Login / Sign Up" class="btn btn-primary">
          </form>
          
          </div>
          
        </div>
      </div>
    </section>
  </center>
  {% endblock home %}
